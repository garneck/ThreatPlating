name: Debug CurseForge upload

# Temporary diagnostic for the persistent HTTP 400 "Missing field `metadata`"
# from the upload API. Uses a dummy zip on purpose: if any variant gets past
# multipart parsing, the response changes to a package-validation error and
# nothing can actually be published. Delete this workflow once resolved.
on:
  workflow_dispatch:

env:
  CF_API_KEY: ${{ secrets.CF_API_KEY }}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe upload API
        shell: bash
        run: |
          set -uo pipefail

          curl --version | head -n 1

          workdir="$RUNNER_TEMP/probe"
          mkdir -p "$workdir"
          cd "$workdir"

          echo "probe" > probe.txt
          zip -q dummy.zip probe.txt
          printf '%s' '{"changelog":"probe","releaseType":"alpha","gameVersions":[16533]}' > metadata.json

          echo "== what does this curl send? (httpbin echo) =="
          for label in "h2 metadata=<file" "h1.1 metadata=<file" "h1.1 form-string" "h1.1 form-string no-expect"; do
            case "$label" in
              "h2 metadata=<file") flags=(-F "metadata=<metadata.json" -F "file=@dummy.zip") ;;
              "h1.1 metadata=<file") flags=(--http1.1 -F "metadata=<metadata.json" -F "file=@dummy.zip") ;;
              "h1.1 form-string") flags=(--http1.1 --form-string "metadata=$(< metadata.json)" -F "file=@dummy.zip") ;;
              "h1.1 form-string no-expect") flags=(--http1.1 -H "Expect:" --form-string "metadata=$(< metadata.json)" -F "file=@dummy.zip") ;;
            esac
            echo "-- $label"
            curl --silent --show-error "${flags[@]}" https://httpbin.org/post \
              | jq -c '{cl: .headers."Content-Length", te: .headers."Transfer-Encoding", expect: .headers.Expect, form_keys: (.form | keys), file_keys: (.files | keys)}' || true
          done

          echo ""
          echo "== tokenless POST to CurseForge (app reached => 401) =="
          for proto in "--http2" "--http1.1"; do
            status="$(curl --silent --show-error -o resp.txt -w '%{http_code} over http/%{http_version}' \
              $proto -F "metadata=<metadata.json" -F "file=@dummy.zip" \
              https://wow.curseforge.com/api/projects/1639203/upload-file)" || true
            echo "$proto -> $status : $(head -c 120 resp.txt)"
            rm -f resp.txt
          done

          echo ""
          echo "== token shape and cross-API acceptance =="
          echo "token length: ${#CF_API_KEY}"
          case "$CF_API_KEY" in
            \$2*) echo "shape: bcrypt-style (CurseForge for Studios key)" ;;
            *-*-*-*-*) echo "shape: uuid-style (legacy authors token)" ;;
            *) echo "shape: other" ;;
          esac
          studios="$(curl --silent -o /dev/null -w '%{http_code}' \
            -H "x-api-key: $CF_API_KEY" https://api.curseforge.com/v1/games)" || true
          echo "Studios download API (api.curseforge.com) accepts it: HTTP $studios"

          echo ""
          echo "== same tokened request against other project ids =="
          # A foreign real project should answer 403 (no permission) if and only
          # if the metadata field parsed; a bogus id shows whether the project is
          # resolved before or after field validation.
          for pid in 1639203 61284 999999999; do
            status="$(curl --silent --show-error -o resp.txt \
              -w '%{http_code}' \
              -H "x-api-token: $CF_API_KEY" \
              -F "metadata=<metadata.json" -F "file=@dummy.zip" \
              "https://wow.curseforge.com/api/projects/$pid/upload-file")" || true
            echo "project $pid -> $status : $(head -c 160 resp.txt)"
            rm -f resp.txt
          done

          echo ""
          echo "== prebuilt multipart body via --data-binary (guaranteed Content-Length), with token =="
          boundary="----ThreatPlatingBoundary$RANDOM$RANDOM"
          body="body.bin"
          {
            printf -- '--%s\r\n' "$boundary"
            printf 'Content-Disposition: form-data; name="metadata"\r\n'
            printf 'Content-Type: application/json\r\n\r\n'
            cat metadata.json
            printf '\r\n--%s\r\n' "$boundary"
            printf 'Content-Disposition: form-data; name="file"; filename="dummy.zip"\r\n'
            printf 'Content-Type: application/zip\r\n\r\n'
            cat dummy.zip
            printf '\r\n--%s--\r\n' "$boundary"
          } > "$body"
          status="$(curl --silent --show-error -o resp.txt -D headers.txt \
            -w '%{http_code} over http/%{http_version}' \
            -H "x-api-token: $CF_API_KEY" \
            -H "Content-Type: multipart/form-data; boundary=$boundary" \
            --data-binary "@$body" \
            https://wow.curseforge.com/api/projects/1639203/upload-file)" || true
          echo "status: $status"
          echo "response: $(head -c 300 resp.txt)"
          grep -i -E '^(server|x-aspnet)' headers.txt || true
